name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Traffic-Light
          path: build/Claude Traffic Light.app
